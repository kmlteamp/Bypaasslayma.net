.section-label{

.open-btn{background:var(--green);color:#000}

const $ = id => document.getElementById(id);

// ===== GHI LOG =====
function log(msg, type = 'info'){
  const div = document.createElement('div');
  div.className = 'log-entry log-' + type;
  const time = new Date().toLocaleTimeString('vi-VN');
  div.textContent = '[' + time + '] ' + msg;
  logBox.appendChild(div);
  logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(text){ statusText.textContent = text; }

function setProgress(pct){
  progress.classList.add('show');
  progressBar.style.width = pct + '%';
  if(pct >= 100) setTimeout(() => progress.classList.remove('show'), 800);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function setStep(n, state){
  const el = $('step' + n);
  if(!el) return;
  el.classList.remove('active', 'done');
  if(state) el.classList.add(state);
}
function resetSteps(){
  for(let i=1;i<=4;i++) setStep(i, null);
  captchaBadge.className = 'captcha-badge captcha-none';
  captchaBadge.textContent = 'CHƯA PHÁT HIỆN';
}

// ===== PHÁT HIỆN LOẠI CAPTCHA =====
function detectCaptchaType(html){
  if(!html) return { type: 'none', confidence: 0 };
  const lower = html.toLowerCase();

  // Cloudflare Turnstile
  if(lower.includes('cf-turnstile') || lower.includes('challenges.cloudflare.com')){
    return { type: 'turnstile', confidence: 95 };
  }

  // hCaptcha
  if(lower.includes('h-captcha') || lower.includes('hcaptcha.com')){
    return { type: 'hcaptcha', confidence: 95 };
  }

  // reCAPTCHA v3 (thường không hiện widget, chỉ có script)
  if(lower.includes('recaptcha/api.js?render=') || lower.includes('grecaptcha.execute')){
    return { type: 'recaptcha_v3', confidence: 90 };
  }

  // reCAPTCHA v2
  if(lower.includes('g-recaptcha') || lower.includes('google.com/recaptcha')){
    return { type: 'recaptcha_v2', confidence: 95 };
  }

  // GAGUCHA (tùy chỉnh)
  if(lower.includes('gagucha')){
    return { type: 'gagucha', confidence: 90 };
  }

  // Captcha chung
  if(lower.includes('captcha')){
    return { type: 'unknown', confidence: 50 };
  }

  return { type: 'none', confidence: 0 };
}

// Cập nhật badge CAPTCHA
function updateCaptchaBadge(type){
  const labels = {
    'none': 'KHÔNG CÓ CAPTCHA',
    'recaptcha_v2': 'RECAPTCHA V2',
    'recaptcha_v3': 'RECAPTCHA V3',
    'hcaptcha': 'HCAPTCHA',
    'turnstile': 'TURNSTILE',
    'gagucha': 'GAGUCHA',
    'unknown': 'CAPTCHA KHÁC'
  };
  captchaBadge.className = 'captcha-badge captcha-' + (type === 'none' ? 'none' : type.replace('_v2','').replace('_v3',''));
  captchaBadge.textContent = labels[type] || 'CAPTCHA';
}

// ===== GỌI QUA PROXY =====
async function fetchViaProxy(targetUrl, options = {}){
  for(const proxy of PROXIES){
    try{
      const proxyUrl = proxy.url + encodeURIComponent(targetUrl);
      log('Proxy ' + proxy.name + ': ' + proxyUrl.slice(0, 50) + '...', 'dim');

      const res = await fetch(proxyUrl, {
        method: options.method || 'GET',
        headers: {
          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
          'Accept': 'text/html,application/json,*/*',
          ...(options.headers || {})
        },
        body: options.body
      });

      if(!res.ok){
        log('HTTP ' + res.status + ' từ ' + proxy.name, 'warn');
        continue;
      }

      const text = await res.text();
      log('Nhận ' + text.length + ' bytes từ ' + proxy.name, 'ok');
      return text;
    }catch(e){
      log(proxy.name + ' lỗi: ' + e.message, 'warn');
    }
  }
  return null;
}

// ===== PHÂN TÍCH TRANG CAPTCHA =====
function analyzeCaptchaPage(html, type){
  const info = {
    type: type,
    formAction: '',
    formMethod: 'POST',
    hiddenFields: {},
    siteKey: '',
    callbackName: '',
    verifyUrl: '',
    delayMs: 3000,
    action: ''
  };

  if(!html) return info;

  // Form
  const formM = html.match(/<form[^>]*action=["']([^"']*)["'][^>]*method=["']([^"']+)["']/i);
  if(formM){
    info.formAction = formM[1];
    info.formMethod = formM[2].toUpperCase();
  }

  // Hidden inputs
  const hiddenRe = /<input[^>]+type=["']hidden["'][^>]*>/gi;
  const hiddenList = html.match(hiddenRe) || [];
  for(const inp of hiddenList){
    const nameM = inp.match(/name=["']([^"']+)["']/i);
    const valueM = inp.match(/value=["']([^"']*)["']/i);
    if(nameM){
      info.hiddenFields[nameM[1]] = valueM ? valueM[1] : '';
    }
  }

  // Site key theo loại CAPTCHA
  if(type === 'recaptcha_v2'){
    const m = html.match(/data-sitekey=["']([^"']+)["']/i);
    if(m) info.siteKey = m[1];
  }else if(type === 'recaptcha_v3'){
    const m = html.match(/render=([a-zA-Z0-9_-]+)/) ||
              html.match(/sitekey["']?\s*[:=]\s*["']([^"']+)["']/i);
    if(m) info.siteKey = m[1];
    const aM = html.match(/grecaptcha\.execute\([^,]+,\s*\{[^}]*action:\s*["']([^"']+)["']/);
    if(aM) info.action = aM[1];
  }else if(type === 'hcaptcha'){
    const m = html.match(/data-sitekey=["']([^"']+)["'][^>]*class=["'][^"']*h-captcha/i) ||
              html.match(/data-sitekey=["']([^"']+)["']/i);
    if(m) info.siteKey = m[1];
  }else if(type === 'turnstile'){
    const m = html.match(/data-sitekey=["']([^"']+)["'][^>]*class=["'][^"']*cf-turnstile/i) ||
              html.match(/data-sitekey=["']([^"']+)["']/i);
    if(m) info.siteKey = m[1];
  }

  // Callback function name
  const cbM = html.match(/data-callback=["']([^"']+)["']/i);
  if(cbM) info.callbackName = cbM[1];

  // Verify URL trong script
  const vM = html.match(/["'](\/?(?:api\/)?(?:verify|captcha|check|validate)[^"'\s]*)["']/i);
  if(vM) info.verifyUrl = vM[1];

  // Delay từ setTimeout
  const dM = html.match(/setTimeout\s*\(\s*(?:function|\()/);
  if(dM){
    const tm = html.match(/setTimeout\s*\([^,]*,\s*(\d+)/);
    if(tm) info.delayMs = Math.min(parseInt(tm[1], 10), 8000);
  }

  return info;
}

// ===== TẠO TOKEN GIẢ LẬP =====
function generateFakeToken(type, siteKey){
  // Token giả - không pass được verify thật nhưng đúng format để thử
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
  let token = '';
  const len = type === 'turnstile' ? 500 : type === 'hcaptcha' ? 200 : 1000;
  for(let i = 0; i < len; i++){
    token += chars.charAt(Math.floor(Math.random() * chars.length));
  }

  // Prefix theo loại
  if(type === 'recaptcha_v2' || type === 'recaptcha_v3'){
    token = '03AGdBq24' + token;
  }else if(type === 'turnstile'){
    token = '0.' + token;
  }else if(type === 'hcaptcha'){
    token = 'P0_' + token;
  }
  return token;
}

// ===== AUTO SOLVE CAPTCHA =====
async function autoSolveCaptcha(html, pageUrl, captchaType){
  log('Bắt đầu auto solve ' + captchaType.toUpperCase() + '...', 'info');

  const info = analyzeCaptchaPage(html, captchaType);

  log('Phân tích kết quả:', 'info');
  if(info.formAction) log('  → Form action: ' + info.formAction, 'ok');
  if(info.siteKey) log('  → Site key: ' + info.siteKey.slice(0, 30) + '...', 'ok');
  if(info.callbackName) log('  → Callback: ' + info.callbackName, 'ok');
  if(info.verifyUrl) log('  → Verify URL: ' + info.verifyUrl, 'ok');
  const fieldCount = Object.keys(info.hiddenFields).length;
  if(fieldCount > 0){
    log('  → ' + fieldCount + ' hidden field(s): ' + Object.keys(info.hiddenFields).join(', '), 'ok');
  }
  log('  → Delay đề xuất: ' + info.delayMs + 'ms', 'dim');

  // BƯỚC 1: Delay mô phỏng con người
  log('Chờ ' + Math.round(info.delayMs / 1000) + 's để mô phỏng tương tác con người...', 'dim');
  for(let i = 0; i < info.delayMs; i += 500){
    await sleep(500);
    setProgress(45 + Math.floor((i / info.delayMs) * 15));
  }

  // BƯỚC 2: Tạo token giả lập
  const fakeToken = generateFakeToken(captchaType, info.siteKey);
  log('Token giả lập: ' + fakeToken.slice(0, 40) + '...', 'dim');

  // BƯỚC 3: Xây dựng form data để submit
  const formData = new URLSearchParams();

  // Thêm hidden fields gốc
  for(const [name, value] of Object.entries(info.hiddenFields)){
    formData.append(name, value);
  }

  // Thêm token theo loại
  if(captchaType === 'recaptcha_v2' || captchaType === 'recaptcha_v3'){
    formData.append('g-recaptcha-response', fakeToken);
  }else if(captchaType === 'hcaptcha'){
    formData.append('h-captcha-response', fakeToken);
    formData.append('g-recaptcha-response', fakeToken);
  }else if(captchaType === 'turnstile'){
    formData.append('cf-turnstile-response', fakeToken);
  }else if(captchaType === 'gagucha'){
    formData.append('gagucha-response', fakeToken);
    formData.append('captcha', fakeToken);
  }else{
    formData.append('captcha', fakeToken);
    formData.append('g-recaptcha-response', fakeToken);
  }

  // BƯỚC 4: Thử POST tới form action
  if(info.formAction){
    try{
      const actionUrl = info.formAction.startsWith('http')
        ? info.formAction
        : new URL(info.formAction, pageUrl).href;

      log('Gửi POST tới: ' + actionUrl, 'info');

      const resp = await fetchViaProxy(actionUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      });

      if(resp){
        log('Nhận phản hồi: ' + resp.length + ' bytes', 'ok');
        const target = parseTargetFromHTML(resp);
        if(target){
          log('Tìm thấy link đích trong phản hồi verify!', 'ok');
          return { success: true, html: resp, target: target };
        }
        // Có thể HTML mới vẫn còn captcha, thử lại 1 lần
        if(detectCaptchaType(resp).type === 'none'){
          return { success: true, html: resp, target: null };
        }
      }
    }catch(e){
      log('POST action lỗi: ' + e.message, 'warn');
    }
  }

  // BƯỚC 5: Thử GET lại URL gốc (nhiều site chỉ cần chờ)
  log('Thử GET lại URL gốc sau khi "giải" CAPTCHA...', 'info');
  const reHtml = await fetchViaProxy(pageUrl);
  if(reHtml){
    const newType = detectCaptchaType(reHtml).type;
    if(newType === 'none'){
      log('Trang đã hết CAPTCHA!', 'ok');
      return { success: true, html: reHtml, target: parseTargetFromHTML(reHtml) };
    }
  }

  // BƯỚC 6: Fallback nhờ AI
  log('Thử fallback qua AI...', 'warn');
  try{
    const aiResp = await askAI(html, pageUrl, 'captcha');
    if(aiResp && aiResp.includes('http')){
      const m = aiResp.match(/https?:\/\/[^\s"'<>]+/);
      if(m) return { success: true, html: html, target: m[0] };
    }
  }catch(e){
    log('AI lỗi: ' + e.message, 'warn');
  }

  return { success: false, html: html, target: null };
}

// ===== PARSE LINK ĐÍCH =====
function parseTargetFromHTML(html){
  if(!html) return null;

  let m = html.match(/http-equiv=["']refresh["'][^>]*content=["'][^;]+;\s*url=([^"'\s>]+)/i);
  if(m) return decodeURIComponent(m[1]);

  m = html.match(/<a[^>]+href=["'](https?:\/\/[^"']+)["'][^>]*class=["'][^"']*(?:btn|button|continue|getlink|redirect|download|go|next)/i);
  if(m) return m[1];

  m = html.match(/(?:window\.location|location\.href|location\.replace)\s*[=(]\s*["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  m = html.match(/data-(?:url|href|link)=["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  const allLinks = html.match(/https?:\/\/[^\s"'<>\\]+/g) || [];
  const blacklist = ['layma.net','google','facebook','cloudflare','gstatic','googleapis','jquery','bootstrap','gagucha','hcaptcha','recaptcha'];
  for(const link of allLinks){
    const lower = link.toLowerCase();
    if(!blacklist.some(b => lower.includes(b)) && link.length > 15 &&
       !link.match(/\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$/i)){
      return link;
    }
  }
  return null;
}

// ===== GỌI AI =====
async function askAI(html, url, purpose){
  const snippet = (html || '').substring(0, 4000);

  const prompts = {
    link: 'Đây là HTML trang rút gọn. Tìm URL đích cuối cùng. Chỉ trả về URL. Nếu không có, trả về KHONG_TIM_THAY.',
    captcha: 'Đây là HTML trang có CAPTCHA. Phân tích và nếu tìm thấy URL đích cuối cùng thì trả về. Nếu không, trả về KHONG_TIM_THAY.',
    analyze: 'Đây là HTML trang CAPTCHA. Trả về JSON: {"formAction":"...","method":"POST","siteKey":"...","hiddenFields":{},"verifyUrl":"..."}'
  };

  const res = await fetch(GROQ_URL, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + API_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [
        { role: 'system', content: 'Bạn là tool phân tích HTML chuyên nghiệp. Chỉ trả về đúng định dạng yêu cầu.' },
        { role: 'user', content: prompts[purpose] + '\n\nURL: ' + url + '\n\nHTML:\n' + snippet }
      ],
      temperature: 0.2,
      max_tokens: 500
    })
  });

  if(!res.ok) throw new Error('AI HTTP ' + res.status);
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

// ===== HIỂN THỊ KẾT QUẢ =====
function showResult(link){

  resultLink.href = link;
  resultLink.textContent = link;
  resultBox.classList.add('show');
  setStatus('Thành công');
}

// ===== BYPASS CHÍNH =====
async function bypass(){
  const rawInput = inputUrl.value.trim();
  if(!rawInput){
    log('Vui lòng dán link vào ô trên', 'err');
    return;
  }

  resultBox.classList.remove('show');
  progress.classList.remove('show');
  progressBar.style.width = '0%';
  logBox.innerHTML = '';
  resetSteps();
  setStatus('Đang xử lý...');

  log('=== BẮT ĐẦU AUTO CAPTCHA BYPASS ===', 'info');
  log('Input: ' + rawInput, 'dim');
  setProgress(5);

  const pageUrl = rawInput.startsWith('http') ? rawInput : 'https://layma.net/' + rawInput;

  btnBypass.disabled = true;
  btnBypass.textContent = '⏳ ĐANG XỬ LÝ...';

  try{
    // BƯỚC 1: Lấy HTML
    setStep(1, 'active');
    log('Đang tải HTML từ: ' + pageUrl, 'info');
    let html = await fetchViaProxy(pageUrl);

    if(!html){
      log('Không lấy được HTML từ bất kỳ proxy nào', 'err');
      setStatus('Lỗi proxy');
      setProgress(0);
      return;
    }
    setStep(1, 'done');
    setProgress(25);

    // BƯỚC 2: Phát hiện CAPTCHA
    setStep(2, 'active');
    log('Phân tích loại CAPTCHA...', 'info');
    const detection = detectCaptchaType(html);
    log('Phát hiện: ' + detection.type + ' (độ tin cậy ' + detection.confidence + '%)', 'ok');
    updateCaptchaBadge(detection.type);
    setStep(2, 'done');
    setProgress(40);

    let target = null;

    // BƯỚC 3: Xử lý CAPTCHA nếu có
    if(detection.type !== 'none'){
      setStep(3, 'active');
      const result = await autoSolveCaptcha(html, pageUrl, detection.type);
      if(result.success && result.target){
        target = result.target;
      }else if(result.success && result.html){
        html = result.html;
      }
      setStep(3, 'done');
    }else{
      log('Không có CAPTCHA. Bỏ qua bước giải.', 'ok');
      setStep(3, 'done');
    }
    setProgress(70);

    // BƯỚC 4: Tìm link đích
    setStep(4, 'active');
    if(!target){
      log('Phân tích HTML tìm link đích...', 'info');
      target = parseTargetFromHTML(html);
      if(target) log('Parser tìm thấy link!', 'ok');
    }

    if(!target){
      log('Thử nhờ AI tìm link...', 'info');
      try{
        const aiLink = await askAI(html, pageUrl, 'link');
        if(aiLink && aiLink !== 'KHONG_TIM_THAY'){
          const m = aiLink.match(/https?:\/\/[^\s"'<>]+/);
          if(m){ target = m[0]; log('AI tìm thấy link!', 'ok'); }
        }
      }catch(e){
        log('AI lỗi: ' + e.message, 'warn');
      }
    }

    setProgress(95);

    if(target){
      showResult(target);
      setStep(4, 'done');
      log('=== THÀNH CÔNG ===', 'ok');
      log('Link đích: ' + target, 'ok');
      setProgress(100);
    }else{
      log('Không tìm thấy link đích', 'err');
      log('Gợi ý: CAPTCHA thật cần dịch vụ chuyên dụng (2captcha, capsolver)', 'warn');
      setStatus('Thất bại');
      setProgress(0);
    }

  }catch(e){
    log('Lỗi hệ thống: ' + e.message, 'err');
    setStatus('Lỗi');
    setProgress(0);
  }finally{
    btnBypass.disabled = false;
    btnBypass.textContent = '🚀 AUTO BYPASS CAPTCHA';
  }
}

// ===== RESET =====
function reset(){
  inputUrl.value = '';
  logBox.innerHTML = '<div class="log-entry log-dim">[Hệ thống] Đã reset. Sẵn sàng.</div>';
  resultBox.classList.remove('show');
  progress.classList.remove('show');
  progressBar.style.width = '0%';
  lastResult = '';
  resetSteps();
  setStatus('Sẵn sàng');
}

// ===== DÁN =====
async function pasteFromClipboard(){
  try{
    const text = await navigator.clipboard.readText();
    inputUrl.value = text.trim();
    log('Đã dán link', 'ok');
  }catch(e){
    log('Không đọc được clipboard', 'warn');
  }
}

// ===== COPY =====
function copyResult(){
  if(!lastResult){ log('Không có link', 'err'); return; }
  navigator.clipboard.writeText(lastResult).then(() => {
    log('Đã copy: ' + lastResult, 'ok');
    btnCopy.textContent = '✅ ĐÃ COPY';
    setTimeout(() => btnCopy.textContent = '📋 COPY LINK', 1500);
  });
}

function openResult(){
  if(!lastResult){ log('Không có link', 'err'); return; }
  window.open(lastResult, '_blank', 'noopener');
}

// ===== SỰ KIỆN =====
btnBypass.addEventListener('click', bypass);
btnReset.addEventListener('click', reset);
btnCopy.addEventListener('click', copyResult);
btnOpen.addEventListener('click', openResult);
pasteBtn.addEventListener('click', pasteFromClipboard);

inputUrl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); bypass(); }
});
