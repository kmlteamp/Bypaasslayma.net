<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAYMA.NET Bypass Tool</title>
<style>
:root{
  --bg:#0a0a0f;
  --panel:#111420;
  --panel2:#1a1f30;
  --border:#2a3145;
  --text:#e8edf7;
  --muted:#7f8a9e;
  --purple:#7657ee;
  --purple2:#5540b8;
  --green:#35d69a;
  --red:#ff4d5e;
  --yellow:#ffd166;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:linear-gradient(135deg,#0a0a0f 0%,#10131a 50%,#0d1420 100%);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.container{
  width:100%;
  max-width:640px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px;
  box-shadow:0 30px 80px rgba(118,87,238,.15);
}
.header{
  text-align:center;
  margin-bottom:28px;
}
.logo{
  width:70px;height:70px;
  margin:0 auto 14px;
  border-radius:20px;
  background:linear-gradient(135deg,#8a6cff,#5436c9);
  display:grid;
  place-items:center;
  font-size:34px;
  box-shadow:0 12px 40px rgba(118,87,238,.4);
}
h1{
  font-size:24px;
  margin:0 0 8px;
  letter-spacing:-0.5px;
  color:#fff;
}
.subtitle{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.section-label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
  font-weight:600;
  letter-spacing:0.5px;
}
.input-wrap{
  position:relative;
  margin-bottom:16px;
}
.input-wrap input{
  width:100%;
  padding:16px 50px 16px 16px;
  background:#0d1220;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-family:'Courier New',monospace;
  font-size:14px;
  outline:none;
  transition:all .2s;
}
.input-wrap input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 4px rgba(118,87,238,.15);
}
.input-wrap input::placeholder{color:#556}
.paste-btn{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  background:#1a1f30;
  border:1px solid var(--border);
  color:#aab5c9;
  width:36px;height:36px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  transition:all .15s;
}
.paste-btn:hover{
  background:var(--purple);
  color:#fff;
  border-color:var(--purple);
}
.btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:10px;
}
.btn-primary{
  background:linear-gradient(135deg,#7657ee,#5540b8);
  color:#fff;
}
.btn-primary:hover{
  filter:brightness(1.15);
  transform:translateY(-1px);
  box-shadow:0 10px 30px rgba(118,87,238,.4);
}
.btn-primary:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}
.btn-secondary{
  background:transparent;
  color:var(--muted);
  border:1px solid var(--border);
}
.btn-secondary:hover{
  color:#fff;
  border-color:var(--purple);
}
.progress{
  height:4px;
  background:#0d1220;
  border-radius:2px;
  overflow:hidden;
  margin:16px 0;
  display:none;
}
.progress.show{display:block}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,#7657ee,#35d69a);
  width:0%;
  transition:width .3s;
}
.log{
  background:#000;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  height:200px;
  overflow-y:auto;
  font-family:'Courier New',monospace;
  font-size:12px;
  line-height:1.7;
  margin-top:16px;
}
.log-entry{margin-bottom:3px;word-break:break-word}
.log-ok{color:var(--green)}
.log-err{color:var(--red)}
.log-info{color:var(--yellow)}
.log-warn{color:#ffaa00}
.log-dim{color:#556}
.result{
  background:linear-gradient(135deg,#0f2a22,#0a1e18);
  border:1px solid var(--green);
  border-radius:14px;
  padding:18px;
  margin-top:16px;
  display:none;
}
.result.show{display:block}
.result-label{
  color:var(--green);
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:10px;
}
.result-link{
  color:#7fffc9;
  font-size:14px;
  word-break:break-all;
  text-decoration:none;
  display:block;
  padding:12px;
  background:#000;
  border-radius:8px;
  margin-bottom:10px;
  font-family:'Courier New',monospace;
  line-height:1.6;
  transition:background .2s;
}
.result-link:hover{background:#0a1a14}
.result-actions{
  display:flex;
  gap:8px;
}
.result-actions button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
}
.copy-btn{
  background:#0055aa;
  color:#fff;
}
.copy-btn:hover{background:#0088ff}
.open-btn{
  background:var(--green);
  color:#000;
}
.open-btn:hover{filter:brightness(1.15)}
.status-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 12px;
  background:#0d1220;
  border:1px solid var(--border);
  border-radius:20px;
  font-size:11px;
  color:var(--muted);
  margin-bottom:20px;
}
.status-dot{
  width:7px;height:7px;
  background:var(--green);
  border-radius:50%;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.4}
}
@media(max-width:600px){
  .container{padding:22px}
  h1{font-size:20px}
  .logo{width:60px;height:60px;font-size:28px}
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">🔓</div>
    <h1>LAYMA.NET Bypass</h1>
    <div class="subtitle">Vượt link trung gian — Lấy link gốc tự động</div>
  </div>

  <div style="text-align:center">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Sẵn sàng</span>
    </div>
  </div>

  <label class="section-label">DÁN LINK LAYMA.NET</label>
  <div class="input-wrap">
    <input type="text" id="inputUrl" placeholder="https://layma.net/xxxxx" autocomplete="off">
    <button class="paste-btn" id="pasteBtn" title="Dán">📋</button>
  </div>

  <button class="btn btn-primary" id="btnBypass">
    🚀 BẮT ĐẦU BYPASS
  </button>

  </button>

    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="log" id="log">

  <div class="result" id="result">

    <a class="result-link" id="resultLink" href="#" target="_blank" rel="noopener"></a>
    <div class="result-actions">
      <button class="copy-btn" id="btnCopy">📋 COPY LINK</button>
      <button class="open-btn" id="btnOpen">🔗 MỞ LINK</button>
    </div>
  </div>

</div>

<script>
"use strict";

// ============================================================
// LAYMA.NET BYPASS TOOL
// Bypass By nhatanh Dev
// API Key: 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
// ============================================================

const API_KEY = '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';
const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
const ALLORIGINS = 'https://api.allorigins.win/raw?url=';
const CORS_PROXY = 'https://corsproxy.io/?';

const $ = id => document.getElementById(id);

const inputUrl = $('inputUrl');
const btnBypass = $('btnBypass');
const btnReset = $('btnReset');
const btnCopy = $('btnCopy');
const btnOpen = $('btnOpen');
const pasteBtn = $('pasteBtn');
const logBox = $('log');
const progress = $('progress');
const progressBar = $('progressBar');
const resultBox = $('result');
const resultLink = $('resultLink');
const statusText = $('statusText');

let lastResult = '';

// ===== GHI LOG =====
function log(msg, type = 'info'){
  const div = document.createElement('div');
  div.className = 'log-entry log-' + type;
  const time = new Date().toLocaleTimeString('vi-VN');
  div.textContent = '[' + time + '] ' + msg;
  logBox.appendChild(div);
  logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(text){
  statusText.textContent = text;
}

function setProgress(pct){
  progress.classList.add('show');
  progressBar.style.width = pct + '%';
  if(pct >= 100){
    setTimeout(() => progress.classList.remove('show'), 800);
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// ===== LẤY TOKEN TỪ URL LAYMA =====
function extractToken(url){
  try{
    const u = new URL(url.trim());
    const path = u.pathname.replace(/^\/+/, '');
    return path.split('/')[0] || '';
  }catch(e){
    // Nếu user chỉ dán token
    return url.trim().replace(/^\/+/, '').split('/')[0];
  }
}

// ===== GỌI QUA PROXY ĐỂ LẤY HTML =====
async function fetchViaProxy(targetUrl){
  const proxies = [
    ALLORIGINS + encodeURIComponent(targetUrl),
    CORS_PROXY + encodeURIComponent(targetUrl)
  ];

  for(const proxyUrl of proxies){
    try{
      log('Thử proxy: ' + proxyUrl.slice(0, 60) + '...', 'dim');
      const res = await fetch(proxyUrl, {
        method: 'GET',
        headers: {
          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
        }
      });
      if(!res.ok){
        log('Proxy trả về HTTP ' + res.status, 'warn');
        continue;
      }
      const text = await res.text();
      log('Nhận ' + text.length + ' bytes', 'ok');
      return text;
    }catch(e){
      log('Proxy lỗi: ' + e.message, 'warn');
    }
  }
  return null;
}

// ===== PHÂN TÍCH HTML ĐỂ LẤY LINK ĐÍCH =====
function parseTargetFromHTML(html){
  if(!html) return null;

  // 1. Tìm meta refresh
  let m = html.match(/http-equiv=["']refresh["'][^>]*content=["'][^;]+;\s*url=([^"'\s>]+)/i);
  if(m) return decodeURIComponent(m[1]);

  // 2. Tìm link trong button/a với class continue/getlink/redirect
  m = html.match(/<a[^>]+href=["'](https?:\/\/[^"']+)["'][^>]*class=["'][^"']*(?:btn|button|continue|getlink|redirect|download|go|next)/i);
  if(m) return m[1];

  // 3. Tìm window.location / location.href trong script
  m = html.match(/(?:window\.location|location\.href|location\.replace)\s*[=(]\s*["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  // 4. Tìm data-url / data-href
  m = html.match(/data-(?:url|href|link)=["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  // 5. Tìm var/let/const url = "..."
  m = html.match(/(?:var|let|const)\s+(?:url|link|target|redirect|destination)\s*=\s*["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  // 6. Quét tất cả link ngoài layma
  const allLinks = html.match(/https?:\/\/[^\s"'<>\\]+/g) || [];
  const blacklist = ['layma.net', 'google', 'facebook', 'cloudflare', 'gstatic', 'googleapis', 'jquery', 'bootstrap'];
  for(const link of allLinks){
    const lower = link.toLowerCase();
    if(!blacklist.some(b => lower.includes(b)) && link.length > 15 && !link.includes('.css') && !link.includes('.js') && !link.includes('.png') && !link.includes('.jpg')){
      return link;
    }
  }

  return null;
}

// ===== GỌI AI ĐỂ PHÂN TÍCH (FALLBACK) =====
async function askAI(html, url){
  const snippet = html.substring(0, 4000);
  const prompt = 'Đây là HTML của một trang rút gọn link LAYMA.NET. ' +
    'Hãy tìm và trả về CHỈ link đích cuối cùng (URL ngoài layma.net). ' +
    'Chỉ trả về URL, không giải thích, không thêm ký tự gì khác. ' +
    'Nếu không tìm thấy, trả về "KHONG_TIM_THAY".\n\n' +
    'URL gốc: ' + url + '\n\n' +
    'HTML:\n' + snippet;

  const res = await fetch(GROQ_URL, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + API_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [
        { role: 'system', content: 'Bạn là tool trích xuất link. Chỉ trả về URL, không thêm gì.' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.2,
      max_tokens: 500
    })
  });

  if(!res.ok) throw new Error('AI HTTP ' + res.status);
  const data = await res.json();
  const text = data.choices[0].message.content.trim();

  // Tìm URL trong câu trả lời
  const m = text.match(/https?:\/\/[^\s"'<>]+/);
  return m ? m[0] : null;
}

// ===== HIỂN THỊ KẾT QUẢ =====
function showResult(link){
  lastResult = link;
  resultLink.href = link;
  resultLink.textContent = link;
  resultBox.classList.add('show');
  setStatus('Thành công');
}

// ===== BYPASS CHÍNH =====
async function bypass(){
  const rawInput = inputUrl.value.trim();
  if(!rawInput){
    log('Vui lòng dán link LAYMA.NET vào ô trên', 'err');
    return;
  }

  // Reset
  resultBox.classList.remove('show');
  progress.classList.remove('show');
  progressBar.style.width = '0%';
  logBox.innerHTML = '';
  setStatus('Đang xử lý...');

  log('=== BẮT ĐẦU BYPASS ===', 'info');
  log('Input: ' + rawInput, 'dim');
  setProgress(10);

  const token = extractToken(rawInput);
  if(!token){
    log('Không trích xuất được token từ link', 'err');
    setStatus('Lỗi');
    return;
  }
  log('Token: ' + token, 'ok');
  setProgress(25);

  btnBypass.disabled = true;
  btnBypass.textContent = '⏳ ĐANG XỬ LÝ...';

  try{
    // Thử nhiều URL khả dĩ
    const urlsToTry = [
      'https://layma.net/' + token,
      rawInput.startsWith('http') ? rawInput : 'https://layma.net/' + token
    ];

    let html = null;
    let sourceUrl = '';

    for(const u of urlsToTry){
      log('Đang lấy: ' + u, 'info');
      html = await fetchViaProxy(u);
      if(html){
        sourceUrl = u;
        break;
      }
    }

    setProgress(60);

    if(!html){
      log('Không lấy được HTML từ server. Thử AI phân tích trực tiếp...', 'warn');
    }

    let target = null;

    // Bước 1: Parse HTML bằng regex
    if(html){
      log('Đang phân tích HTML tìm link đích...', 'info');
      target = parseTargetFromHTML(html);
      if(target){
        log('Đã tìm thấy link đích qua HTML parser', 'ok');
      }
    }

    setProgress(75);

    // Bước 2: Nếu không có → dùng AI
    if(!target){
      log('Không tìm thấy bằng parser. Đang nhờ AI phân tích...', 'warn');
      try{
        target = await askAI(html || 'Không có HTML', rawInput);
        if(target === 'KHONG_TIM_THAY') target = null;
        if(target) log('AI đã tìm thấy link đích', 'ok');
      }catch(e){
        log('AI lỗi: ' + e.message, 'err');
      }
    }

    setProgress(90);

    // Kết quả
    if(target){
      showResult(target);
      log('=== BYPASS THÀNH CÔNG ===', 'ok');
      log('Link đích: ' + target, 'ok');
      setProgress(100);
    }else{
      log('Không tìm thấy link đích trong HTML', 'err');
      log('Gợi ý: Link có thể đã hết hạn hoặc cần CAPTCHA', 'warn');
      setStatus('Thất bại');
      setProgress(0);
    }

  }catch(e){
    log('Lỗi hệ thống: ' + e.message, 'err');
    setStatus('Lỗi');
    setProgress(0);
  }finally{
    btnBypass.disabled = false;
    btnBypass.textContent = '🚀 BẮT ĐẦU BYPASS';
  }
}

// ===== RESET =====
function reset(){
  inputUrl.value = '';
  logBox.innerHTML = '<div class="log-entry log-dim">[Hệ thống] Đã reset. Sẵn sàng.</div>';
  resultBox.classList.remove('show');
  progress.classList.remove('show');
  progressBar.style.width = '0%';
  lastResult = '';
  setStatus('Sẵn sàng');
}

// ===== DÁN =====
async function pasteFromClipboard(){
  try{
    const text = await navigator.clipboard.readText();
    inputUrl.value = text.trim();
    log('Đã dán link từ clipboard', 'ok');
  }catch(e){
    log('Không đọc được clipboard. Dán thủ công.', 'warn');
  }
}

// ===== COPY =====
function copyResult(){
  if(!lastResult){ log('Không có link để copy', 'err'); return; }
  navigator.clipboard.writeText(lastResult).then(() => {
    log('Đã copy link: ' + lastResult, 'ok');
    btnCopy.textContent = '✅ ĐÃ COPY';
    setTimeout(() => btnCopy.textContent = '📋 COPY LINK', 1500);
  }).catch(() => log('Copy thất bại', 'err'));
}

// ===== MỞ LINK =====
function openResult(){
  if(!lastResult){ log('Không có link để mở', 'err'); return; }
  window.open(lastResult, '_blank', 'noopener');
}

// ===== SỰ KIỆN =====
btnBypass.addEventListener('click', bypass);
btnReset.addEventListener('click', reset);
btnCopy.addEventListener('click', copyResult);
btnOpen.addEventListener('click', openResult);
pasteBtn.addEventListener('click', pasteFromClipboard);

inputUrl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); bypass(); }
});

// ===== KHỞI TẠO =====
log('Tool đã sẵn sàng. Dán link LAYMA và nhấn BYPASS.', 'ok');
log('Admin: NGUYỄN CÔNG BẰNG', 'dim');
</script>
</body>
</html>
