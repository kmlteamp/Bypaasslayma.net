function log(msg, type = 'info'){

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// ===== LẤY TOKEN =====
function extractToken(url){
  try{
    const u = new URL(url.trim());
    const path = u.pathname.replace(/^\/+/, '');
    return path.split('/')[0] || '';
  }catch(e){
    return url.trim().replace(/^\/+/, '').split('/')[0];
  }
}

// ===== GỌI QUA PROXY =====
async function fetchViaProxy(targetUrl){
  const proxies = [
    ALLORIGINS + encodeURIComponent(targetUrl),
    CORS_PROXY + encodeURIComponent(targetUrl),
    THINGPROXY + targetUrl
  ];

  for(const proxyUrl of proxies){
    try{
      log('Thử proxy: ' + proxyUrl.slice(0, 55) + '...', 'dim');
      const res = await fetch(proxyUrl, {
        method: 'GET',
        headers: {
          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
          'Accept': 'text/html,application/json,*/*'
        }
      });
      if(!res.ok){
        log('HTTP ' + res.status, 'warn');
        continue;
      }
      const text = await res.text();
      log('Nhận ' + text.length + ' bytes', 'ok');
      return text;
    }catch(e){
      log('Proxy lỗi: ' + e.message, 'warn');
    }
  }
  return null;
}

// ===== PHÂN TÍCH HTML =====
function parseTargetFromHTML(html){
  if(!html) return null;

  // 1. Meta refresh
  let m = html.match(/http-equiv=["']refresh["'][^>]*content=["'][^;]+;\s*url=([^"'\s>]+)/i);
  if(m) return decodeURIComponent(m[1]);

  // 2. Link với class continue/getlink/redirect/download
  m = html.match(/<a[^>]+href=["'](https?:\/\/[^"']+)["'][^>]*class=["'][^"']*(?:btn|button|continue|getlink|redirect|download|go|next)/i);
  if(m) return m[1];

  // 3. window.location / location.href
  m = html.match(/(?:window\.location|location\.href|location\.replace)\s*[=(]\s*["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  // 4. data-url / data-href
  m = html.match(/data-(?:url|href|link)=["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  // 5. var url = "..."
  m = html.match(/(?:var|let|const)\s+(?:url|link|target|redirect|destination)\s*=\s*["'](https?:\/\/[^"']+)["']/i);
  if(m) return m[1];

  // 6. Quét tất cả link ngoài
  const allLinks = html.match(/https?:\/\/[^\s"'<>\\]+/g) || [];
  const blacklist = ['layma.net','google','facebook','cloudflare','gstatic','googleapis','jquery','bootstrap','gagucha'];
  for(const link of allLinks){
    const lower = link.toLowerCase();
    if(!blacklist.some(b => lower.includes(b)) && link.length > 15 &&
       !link.match(/\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$/i)){
      return link;
    }
  }
  return null;
}

// ===== NHẬN DIỆN GAGUCHA =====
function isGaguchaPage(html){
  if(!html) return false;
  const lower = html.toLowerCase();
  return lower.includes('gagucha') ||
         lower.includes('g-recaptcha') ||
         lower.includes('hcaptcha') ||
         lower.includes('cf-turnstile') ||
         lower.includes('xác minh') ||
         lower.includes('verify') ||
         lower.includes('captcha');
}

// ===== AUTO XÁC MINH GAGUCHA =====
// Phân tích trang GAGUCHA để lấy form action/token
function analyzeGagucha(html){
  const info = {
    hasForm: false,
    formAction: '',
    formMethod: 'POST',
    tokenField: '',
    tokenValue: '',
    siteKey: '',
    verifyUrl: '',
    delayMs: 3000
  };

  if(!html) return info;

  // Tìm form
  const formMatch = html.match(/<form[^>]*action=["']([^"']+)["'][^>]*method=["']([^"']+)["']/i);
  if(formMatch){
    info.hasForm = true;
    info.formAction = formMatch[1];
    info.formMethod = formMatch[2].toUpperCase();
  }

  // Tìm hidden input (token thường nằm ở đây)
  const hiddenInputs = html.match(/<input[^>]+type=["']hidden["'][^>]*>/gi) || [];
  for(const inp of hiddenInputs){
    const nameM = inp.match(/name=["']([^"']+)["']/i);
    const valueM = inp.match(/value=["']([^"']*)["']/i);
    if(nameM && valueM){
      const name = nameM[1].toLowerCase();
      if(name.includes('token') || name.includes('csrf') || name.includes('key') || name.includes('_') || name.includes('id')){
        info.tokenField = nameM[1];
        info.tokenValue = valueM[1];
        break;
      }
    }
  }

  // Tìm reCAPTCHA site key
  const recaptchaM = html.match(/data-sitekey=["']([^"']+)["']/i) ||
                     html.match(/sitekey["']?\s*[:=]\s*["']([^"']+)["']/i);
  if(recaptchaM) info.siteKey = recaptchaM[1];

  // Tìm hCaptcha site key
  const hcaptchaM = html.match(/data-sitekey=["']([^"']+)["'][^>]*class=["'][^"']*h-captcha/i);
  if(hcaptchaM) info.siteKey = hcaptchaM[1];

  // Tìm URL verify trực tiếp trong script
  const verifyM = html.match(/["'](\/?(?:api\/)?(?:verify|check|validate|captcha)[^"']*)["']/i);
  if(verifyM) info.verifyUrl = verifyM[1];

  // Tìm timeout/delay được set
  const delayM = html.match(/setTimeout\s*\([^,]+,\s*(\d+)\s*\)/);
  if(delayM) info.delayMs = Math.min(parseInt(delayM[1], 10), 8000);

  return info;
}

// Gửi request xác minh tự động
async function autoVerifyGagucha(html, pageUrl){
  log('Phân tích trang GAGUCHA...', 'info');
  const info = analyzeGagucha(html);

  if(info.hasForm){
    log('Phát hiện form: ' + info.formAction + ' (' + info.formMethod + ')', 'ok');
  }
  if(info.tokenField){
    log('Token field: ' + info.tokenField + ' = ' + info.tokenValue.slice(0, 20) + '...', 'ok');
  }
  if(info.siteKey){
    log('Site key: ' + info.siteKey.slice(0, 30) + '...', 'ok');
  }
  if(info.verifyUrl){
    log('Verify URL: ' + info.verifyUrl, 'ok');
  }

  // Delay mô phỏng hành vi con người
  log('Chờ ' + Math.round(info.delayMs/1000) + 's mô phỏng tương tác...', 'dim');
  await sleep(info.delayMs);

  // Thử gửi form action
  if(info.hasForm && info.formAction){
    try{
      const actionUrl = info.formAction.startsWith('http')
        ? info.formAction
        : new URL(info.formAction, pageUrl).href;

      log('Gửi POST tới: ' + actionUrl, 'info');

      const formData = new URLSearchParams();
      if(info.tokenField) formData.append(info.tokenField, info.tokenValue);
      if(info.siteKey) formData.append('g-recaptcha-response', 'auto-verified-token');
      formData.append('submit', '1');

      const proxyUrl = ALLORIGINS + encodeURIComponent(actionUrl);

      const res = await fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      });

      if(res.ok){
        const respHtml = await res.text();
        log('Nhận phản hồi: ' + respHtml.length + ' bytes', 'ok');

        // Kiểm tra nếu phản hồi có link đích
        const target = parseTargetFromHTML(respHtml);
        if(target){
          log('Tìm thấy link đích trong phản hồi verify!', 'ok');
          return { success: true, html: respHtml, target: target };
        }
        return { success: true, html: respHtml, target: null };
      }else{
        log('Verify trả HTTP ' + res.status, 'warn');
      }
    }catch(e){
      log('Lỗi gửi verify: ' + e.message, 'warn');
    }
  }

  // Thử GET lại URL gốc sau delay (đôi khi chỉ cần chờ)
  log('Thử lại GET URL gốc sau khi hết delay...', 'info');
  const reHtml = await fetchViaProxy(pageUrl);
  if(reHtml){
    const target = parseTargetFromHTML(reHtml);
    if(target) return { success: true, html: reHtml, target: target };
    return { success: true, html: reHtml, target: null };
  }

  return { success: false, html: html, target: null };
}

// ===== GỌI AI PHÂN TÍCH =====
async function askAI(html, url, purpose){
  const snippet = (html || '').substring(0, 4000);
  const prompts = {
    link: 'Đây là HTML của trang rút gọn LAYMA.NET. Tìm và CHỈ trả về URL đích cuối cùng (ngoài layma.net). Chỉ trả về URL, không giải thích. Nếu không có, trả về KHONG_TIM_THAY.',
    gagucha: 'Đây là HTML của trang xác minh GAGUCHA. Phân tích và trả về JSON: {"formAction":"...","method":"POST","tokenField":"...","tokenValue":"...","siteKey":"...","delay":3000}. Nếu không có trường nào thì để chuỗi rỗng.'
  };

  const res = await fetch(GROQ_URL, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + API_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [
        { role: 'system', content: 'Bạn là tool phân tích HTML. Chỉ trả về kết quả đúng định dạng.' },
        { role: 'user', content: prompts[purpose] + '\n\nURL: ' + url + '\n\nHTML:\n' + snippet }
      ],
      temperature: 0.2,
      max_tokens: 500
    })
  });

  if(!res.ok) throw new Error('AI HTTP ' + res.status);
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

            const parsed = JSON.parse(aiResp.match(/\{[\s\S]*\}/)?.[0] || '{}');
            if(parsed.formAction) gInfo.hasForm = true;
            gInfo.formAction = parsed.formAction || gInfo.formAction;
            gInfo.tokenField = parsed.tokenField || gInfo.tokenField;
            gInfo.tokenValue = parsed.tokenValue || gInfo.tokenValue;
            gInfo.siteKey = parsed.siteKey || gInfo.siteKey;
            if(parsed.delay) gInfo.delayMs = parsed.delay;
          }catch(e){
            log('AI parse JSON lỗi, dùng fallback', 'warn');
          }
        }catch(e){
          log('AI lỗi: ' + e.message, 'warn');
        }
      }

      // Chạy auto verify
      const verifyResult = await autoVerifyGagucha(html, pageUrl);
      if(verifyResult.success){
        html = verifyResult.html;
        target = verifyResult.target;
        if(target){
          log('Auto GAGUCHA thành công! Đã lấy được link đích.', 'ok');
        }else{
          log('Auto GAGUCHA chạy xong, cần tìm link trong HTML mới', 'warn');
        }
      }else{
        log('Auto GAGUCHA không hoàn tất được', 'warn');
      }
    }else{
      log('Không phát hiện GAGUCHA. Tiếp tục bypass thường.', 'ok');
    }
    setStep(3, 'done');
    setProgress(65);

    // ========== BƯỚC 4: TÌM LINK ĐÍCH ==========
    setStep(4, 'active');

    if(!target && html){
      log('Đang phân tích HTML tìm link đích...', 'info');
      target = parseTargetFromHTML(html);
      if(target) log('Đã tìm thấy link đích qua parser', 'ok');
    }

    if(!target && html){
      log('Parser không có kết quả. Nhờ AI phân tích...', 'info');
      try{
        const aiLink = await askAI(html, pageUrl, 'link');
        if(aiLink && aiLink !== 'KHONG_TIM_THAY'){
          const m = aiLink.match(/https?:\/\/[^\s"'<>]+/);
          if(m){ target = m[0]; log('AI đã tìm thấy link đích', 'ok'); }
        }
      }catch(e){
        log('AI lỗi: ' + e.message, 'warn');
      }
    }

    setProgress(90);

    if(target){
      showResult(target);
      setStep(4, 'done');
      log('=== BYPASS THÀNH CÔNG ===', 'ok');
      log('Link đích: ' + target, 'ok');
      setProgress(100);
    }else{
      log('Không tìm thấy link đích', 'err');
      log('Link có thể đã hết hạn hoặc GAGUCHA yêu cầu tương tác', 'warn');
      setStatus('Thất bại');
      setProgress(0);
    }

  }catch(e){
    log('Lỗi hệ thống: ' + e.message, 'err');
    setStatus('Lỗi');
    setProgress(0);
  }finally{
    btnBypass.disabled = false;
    btnBypass.textContent = '🚀 BYPASS + AUTO GAGUCHA';
  }
}

// ===== RESET =====
function reset(){
  inputUrl.value = '';
  logBox.innerHTML = '<div class="log-entry log-dim">[Hệ thống] Đã reset. Sẵn sàng.</div>';
  resultBox.classList.remove('show');
  progress.classList.remove('show');
  progressBar.style.width = '0%';
  lastResult = '';
  resetSteps();
  setStatus('Sẵn sàng');
}

// ===== DÁN =====
async function pasteFromClipboard(){
  try{
    const text = await navigator.clipboard.readText();
    inputUrl.value = text.trim();
    log('Đã dán link từ clipboard', 'ok');
  }catch(e){
    log('Không đọc được clipboard. Dán thủ công.', 'warn');
  }
}

// ===== COPY =====
function copyResult(){
  if(!lastResult){ log('Không có link để copy', 'err'); return; }
  navigator.clipboard.writeText(lastResult).then(() => {
    log('Đã copy: ' + lastResult, 'ok');
    btnCopy.textContent = '✅ ĐÃ COPY';
    setTimeout(() => btnCopy.textContent = '📋 COPY LINK', 1500);
  }).catch(() => log('Copy thất bại', 'err'));
}

function openResult(){
  if(!lastResult){ log('Không có link để mở', 'err'); return; }
  window.open(lastResult, '_blank', 'noopener');
}

// ===== SỰ KIỆN =====
btnBypass.addEventListener('click', bypass);
btnReset.addEventListener('click', reset);
btnCopy.addEventListener('click', copyResult);
btnOpen.addEventListener('click', openResult);
pasteBtn.addEventListener('click', pasteFromClipboard);

inputUrl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); bypass(); }
});

// ===== KHỞI TẠO =====
log('Tool đã sẵn sàng. Auto GAGUCHA đã bật.', 'ok');
log('Admin: NGUYỄN CÔNG BẰNG', 'dim');
</script>
